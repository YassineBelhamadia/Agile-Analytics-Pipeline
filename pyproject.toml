[project]
name = "agile-analytics-pipeline"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Yassine Belhamadia", email = "yassinebelhamadia02@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.6",
    "simpy>=4.1.2",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]

[project.scripts]
agile-analytics-pipeline = "agile_analytics_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
