[project]
name = "agile-analytics-pipeline"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Yassine Belhamadia", email = "yassinebelhamadia02@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dbt-core>=1.12.6,<1.13",
    "dbt-postgres>=1.11.0,<1.12",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.6",
    "simpy>=4.1.2",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]

[project.scripts]
agile-analytics-pipeline = "agile_analytics_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: needs the Postgres warehouse (POSTGRES_* set, e.g. via uv run --env-file .env)"]
# Starlette asks for httpx2 with its TestClient; httpx is the dependency we chose. Known, harmless.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
