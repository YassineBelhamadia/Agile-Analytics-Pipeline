# dbt project for the AAP warehouse: staging tables -> stg views -> marts star schema.
# Run from the repo root:
#   uv run --env-file .env dbt <cmd> --project-dir dbt --profiles-dir dbt
# Docs: docs/etl/03-dbt-star-schema.md

name: aap
version: "1.0.0"
profile: aap

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "logs"]

flags:
  send_anonymous_usage_stats: false

vars:
  # Working days in every sprint (docs/domain-model.md, "Fixed sprint length"; the simulator's
  # SPRINT_LENGTH_HOURS is 10 workdays of 8 hours). Q2's available person-days use it.
  sprint_working_days: 10

# Schema names are exact (stg, marts), not dbt's default <target schema>_<custom schema>.
# See macros/generate_schema_name.sql.
models:
  aap:
    staging:
      +schema: stg
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
    # Session 4 metrics and business-question models: also tables in marts (D-033).
    metrics:
      +schema: marts
      +materialized: table
